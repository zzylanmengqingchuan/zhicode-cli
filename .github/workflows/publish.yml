name: Publish to NPM

# 推送 prod 分支时自动 测试 → 构建 → 发布到 NPM
on:
  push:
    branches: [prod]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # 测试在 import 时会读取 ~/.zhiwen/zhiwen.json；MODEL_API_KEY 供集成测试真实调用模型
      - name: Create model config for tests
        run: |
          mkdir -p ~/.zhiwen
          cat > ~/.zhiwen/zhiwen.json <<EOF
          {
            "model": {
              "model": "kimi-k2.6",
              "apiKey": "${{ secrets.MODEL_API_KEY }}",
              "baseURL": "https://api.moonshot.cn/v1"
            }
          }
          EOF

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # 版本已发布过则跳过，避免重复推送 prod 时发布失败
      - name: Check if version already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to NPM
        if: steps.check.outputs.published == 'false'
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
